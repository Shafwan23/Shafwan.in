<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: 'Italiana'; src: url('../public/fonts/italiana-latin.woff2') format('woff2'); }
  * { margin: 0; }
  body { width: 180px; height: 180px; background: #0F0E0C; overflow: hidden;
         display: grid; place-items: center; }
  .glyph { font-family: 'Italiana', serif; font-size: 132px; line-height: 1;
           color: #EDE8DF; transform: translateY(-8px); }
  .dot { color: #C9A96A; }
</style>
</head>
<body>
  <div class="glyph">S<span class="dot">.</span></div>
</body>
</html>
